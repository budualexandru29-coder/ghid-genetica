<text x="535" y="326" font-size="12" fill="#5b6777">(ND = complex I, CYB = III,</text>
<text x="535" y="343" font-size="12" fill="#5b6777">CO = IV, ATP = ATP-sintaza).</text>
<text x="380" y="570" text-anchor="middle" font-size="10.5" fill="#5b6777">Sursă: UCSC Genome Browser, GRCh38 chrM, pista GENCODE (knownGene). Pozițiile și catenele genelor sunt cele din adnotare.</text></svg>